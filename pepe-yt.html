<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pepe YouTube</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #181818;
    color: white;
}

/* TOP BAR */
.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 20px;
    background: #202020;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 22px;
    font-weight: bold;
}

.pepe { color: #ff4444; }
.youtube {
    color: white;
    background: #ff4444;
    padding: 3px 10px;
    border-radius: 6px;
}

/* TABS */
.tabs {
    display: flex;
    gap: 15px;
    margin-left: 20px;
}

.tab {
    cursor: pointer;
    color: #aaa;
}

.tab:hover {
    color: white;
}

/* SEARCH */
.search-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.search-box {
    width: 300px;
    padding: 10px;
    border-radius: 20px;
    border: none;
    background: #121212;
    color: white;
}

.fast-search-btn {
    padding: 10px 14px;
    border: none;
    border-radius: 20px;
    background: #ff4444;
    color: white;
    cursor: pointer;
}

.fast-search-btn:hover {
    background: #e33a3a;
}

/* GRID */
.container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
    padding: 20px;
}

/* VIDEO CARD */
.video {
    background: #252525;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
}

.video:hover {
    transform: scale(1.03);
}

.thumb {
    width: 100%;
    height: 140px;
    object-fit: cover;
}

.title {
    font-size: 14px;
    font-weight: bold;
    padding: 10px 10px 0 10px;
}

.small {
    font-size: 12px;
    color: #aaa;
    padding: 5px 10px 10px 10px;
}
</style>
</head>

<body>

<div class="topbar">
<div class="logo">
<span class="pepe">Pepe</span>
<span class="youtube">YouTube</span>
</div>

<div class="tabs">
<div class="tab" onclick="setTab('home')">Home</div>
<div class="tab" onclick="setTab('foryou')">For You</div>
<div class="tab" onclick="openShorts()">Shorts</div>
</div>

<div class="search-container">
<input class="search-box" id="search" placeholder="Search...">
<button class="fast-search-btn" onclick="fastSearch()">Fast Search</button>
</div>
</div>

<div class="container" id="results"></div>

<script>
// CHANNELS
const channels = [
"PepeTech","GamingHub","SpaceDaily","CatWorld","CodeLab",
"VlogZone","HistoryNow","MusicMix","AI Central","SportsZone",
"DailyLife","CookingCorner","TravelVibes","FunZone","TechInsider"
];

// TITLE TEMPLATES
const titleTemplates = [
"{query} tips and tricks",
"{query} challenge gone wrong",
"Top 10 {query} moments",
"How to do {query} easily",
"My {query} experience",
"Best {query} compilation",
"{query} in real life",
"Amazing {query} video",
"{query} you won't believe",
"Ultimate {query} guide",
"Testing {query} for 24 hours",
"Crazy {query} moments",
"Hidden secrets of {query}",
"How {query} changed my life",
"{query} explained simply",
"Unbelievable {query} story",
"{query} hacks",
"{query} fails",
"Funny {query} moments",
"{query} adventure"
];

let currentTab = "home";

// GENERATE THUMBNAILS
function thumb(title, i) {
    return `https://picsum.photos/seed/${encodeURIComponent(title)}/400/250`;
}

// GENERATE TITLE BASED ON QUERY OR RANDOM
function generateTitle(query) {
    const template = titleTemplates[Math.floor(Math.random()*titleTemplates.length)];
    if(query) return template.replace(/{query}/gi, query);
    return template.replace(/{query}/gi, ["Cool stuff","Random video","Fun moment","Exciting scene"][Math.floor(Math.random()*4)]);
}

// CREATE VIDEO CARD
function card(title, i) {
    const channel = channels[i % channels.length];
    return `
    <div class="video" onclick="openYT('${title}')">
        <img class="thumb" src="${thumb(title,i)}">
        <div class="title">${title}</div>
        <div class="small">${channel} • Recommended</div>
    </div>
    `;
}

// LOAD HOME
function loadHome() {
    const r = document.getElementById("results");
    r.innerHTML = "";
    for(let i=0;i<60;i++){
        r.innerHTML += card(generateTitle(),i);
    }
}

// LOAD FOR YOU
function loadForYou() {
    const r = document.getElementById("results");
    r.innerHTML = "";
    for(let i=0;i<40;i++){
        r.innerHTML += card(generateTitle(),i);
    }
}

// SEARCH FUNCTION
function search() {
    const q = document.getElementById("search").value.trim();
    const r = document.getElementById("results");
    r.innerHTML = "";
    if(!q){loadHome(); return;}
    for(let i=0;i<40;i++){
        r.innerHTML += card(generateTitle(q),i);
    }
}

// FAST SEARCH: redirects to YouTube AND Google
function fastSearch() {
    const q = document.getElementById("search").value.trim();
    if(!q) return;
    // Open YouTube and Google in new tabs
    window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(q),"_blank");
    window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank");
}

// SWITCH TABS
function setTab(tab){
    currentTab=tab;
    if(tab==="home") loadHome();
    if(tab==="foryou") loadForYou();
}

// OPEN SHORTS
function openShorts(){
    window.location.href="https://www.youtube.com/shorts";
}

// OPEN VIDEO (SEARCH REDIRECT)
function openYT(q){
    window.location.href="https://www.youtube.com/results?search_query="+encodeURIComponent(q);
}

// ENTER KEY SEARCH
document.getElementById("search").addEventListener("keypress", e=>{
    if(e.key==="Enter") search();
});

// INITIAL LOAD
loadHome();

</script>

</body>
</html>
